# Production-like stack: Laravel (PHP 8.3 + Apache) + MySQL 8.
#
#   cp .env.example .env      # then set APP_KEY, JWT_SECRET and DB_PASSWORD
#   docker compose up -d --build
#
# Quick local try-out without secrets (tokens die on every restart):
#   DB_PASSWORD=change-me ALLOW_EPHEMERAL_SECRETS=true docker compose up -d --build
#   open http://localhost:8080
#
# Values in .env are used by the app; DB_* are forced to the bundled MySQL.
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_KEY: ${APP_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOW_EPHEMERAL_SECRETS: ${ALLOW_EPHEMERAL_SECRETS:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
