<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Social card template (1200x630). Rendered by scripts/gen-icons.mjs.
    Placeholders (double curly braces): FONT_URL (Inter variable woff2), MARK (inline mark SVG),
    MONOGRAM (monogram group only, used for the background watermark).
  -->
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('{{FONT_URL}}') format('woff2');
      font-weight: 100 900;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: 'Inter', sans-serif;
      color: #F8FAFC;
      background:
        radial-gradient(ellipse 720px 520px at 1010px 140px, rgba(124, 58, 237, 0.42), rgba(124, 58, 237, 0) 70%),
        radial-gradient(ellipse 640px 460px at 820px 560px, rgba(79, 70, 229, 0.30), rgba(79, 70, 229, 0) 70%),
        radial-gradient(ellipse 520px 360px at 0px 0px, rgba(79, 70, 229, 0.16), rgba(79, 70, 229, 0) 70%),
        #0B1020;
      -webkit-font-smoothing: antialiased;
    }

    /* Faint dot grid, fading out towards the left so the text stays clean. */
    .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(165, 180, 252, 0.16) 1px, transparent 1.4px);
      background-size: 28px 28px;
      -webkit-mask-image: linear-gradient(100deg, transparent 30%, #000 85%);
      mask-image: linear-gradient(100deg, transparent 30%, #000 85%);
    }

    .watermark {
      position: absolute;
      right: -110px;
      top: 40px;
      width: 580px;
      height: 580px;
      opacity: 0.075;
    }

    .content {
      position: absolute;
      left: 72px;
      top: 72px;
      right: 72px;
      bottom: 64px;
      display: flex;
      flex-direction: column;
    }

    .mark {
      width: 104px;
      height: 104px;
      border-radius: 23px;
      box-shadow: 0 18px 48px rgba(79, 70, 229, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .mark svg { display: block; width: 104px; height: 104px; }

    h1 {
      margin-top: 52px;
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.035em;
    }

    h1 .accent {
      background: linear-gradient(100deg, #A5B4FC 0%, #C4B5FD 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.sub {
      margin-top: 22px;
      white-space: nowrap;
      font-size: 30px;
      font-weight: 450;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: #CBD5E1;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 40px;
    }

    .chip {
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: #E0E7FF;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(165, 180, 252, 0.30);
    }

    .footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: 500;
      color: #94A3B8;
      letter-spacing: 0.005em;
    }

    .footer .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #A5B4FC;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <svg class="watermark" viewBox="0 0 64 64" aria-hidden="true">{{MONOGRAM}}</svg>

  <main class="content">
    <div class="mark">{{MARK}}</div>
    <h1>Laravel <span class="accent">Vue</span> SPA</h1>
    <p class="sub">Laravel 12 + Vue 3 starter with JWT auth, i18n and tests</p>
    <div class="chips">
      <span class="chip">Laravel 12</span>
      <span class="chip">Vue 3</span>
      <span class="chip">Vite</span>
      <span class="chip">Pinia</span>
      <span class="chip">JWT</span>
      <span class="chip">Docker</span>
    </div>
    <div class="footer">
      <span class="dot"></span>
      <span>laravel-vue-spa-modern.vercel.app</span>
    </div>
  </main>
</body>
</html>
